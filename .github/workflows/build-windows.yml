name: Monaw UIA - build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'studio/**'

permissions:
  contents: read

concurrency:
  group: monaw-uia-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repair scripts (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch fixed Monaw v1.1.0 source
        run: |
          git clone --no-checkout https://github.com/kailiang0120/monaw.git monaw
          git -C monaw checkout --detach 81ee729c37746fe0560096fba98b2c5449cd89c4
          $actual = (git -C monaw rev-parse HEAD).Trim()
          if ($actual -ne '81ee729c37746fe0560096fba98b2c5449cd89c4') {
            throw "Unexpected source commit: $actual"
          }

      - name: Verify patch-script syntax before modifying Monaw
        run: python -m compileall -q scripts

      - name: Apply packaging and diagnostic fixes
        run: python scripts/apply_fix.py monaw

      - name: Add Windows notifications for completed tasks
        run: python scripts/apply_notifications.py monaw

      - name: Add safe conversation cleanup recovery UI
        run: python scripts/apply_conversation_cleanup.py monaw

      - name: Treat provably pre-dispatch desktop validation errors safely
        run: python scripts/apply_safe_preflight.py monaw

      - name: Show Chrome uncertain-action diagnostics without unsafe retries
        run: python scripts/apply_browser_diagnostics.py monaw

      - name: Enable real deletion of stopped error conversations
        run: python scripts/apply_permanent_delete.py monaw

      - name: Enable actionable Windows approval notifications
        run: python scripts/apply_approval_notifications.py monaw

      - name: Expose verified repair and rollback controls
        run: python scripts/apply_recovery_actions.py monaw

      - name: Enable bounded persistent task execution
        run: python scripts/apply_task_persistence.py monaw

      - name: Bundle Agentrobo Studio skill into Monaw backend
        run: python scripts/install_studio.py monaw

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Test Studio 720p, budgets, scenes and duplicate prevention
        run: |
          python -m unittest discover -s studio/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Studio unit tests failed' }

      - name: Verify Studio skill is registered in Monaw
        working-directory: monaw/backend
        run: |
          uv run --locked --group packaging python -c "from app.agent.skill_loader import load_tools; from app.agent.settings_store import AgentSettings; skills, registry = load_tools(AgentSettings()); assert any(s.name == 'agentrobo-studio' and s.enabled for s in skills); names = {t['name'] for t in registry.get_all_tools()}; assert {'studio_create_project', 'studio_plan_episode', 'studio_prepare_scene', 'studio_assemble_episode'} <= names; print('STUDIO_REGISTERED_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Native Studio skill registration failed' }

      - name: Confirm native Windows automation imports before freezing
        working-directory: monaw/backend
        run: |
          uv run --locked --group packaging python -c "import pywinauto, comtypes, mss, mss.tools, PIL.Image, win32gui, win32process, win32clipboard, win32file; print('SOURCE_UIA_IMPORT_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Unfrozen import test failed' }

      - name: Test desktop preflight safety regressions
        working-directory: monaw/backend
        run: |
          uv run --locked --group dev python -m pytest -q app/agent/tests/test_computer_state.py app/agent/tests/test_local_data_retention.py
          if ($LASTEXITCODE -ne 0) { throw 'Desktop safety regression tests failed' }

      - name: Build frozen Python backend for Windows
        working-directory: monaw/backend
        run: |
          uv run --locked --group packaging pyinstaller packaging/monaw-backend.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }

      - name: Verify imports inside frozen backend
        working-directory: monaw/backend
        run: |
          $exe = '.\dist\monaw-backend\monaw-backend.exe'
          & $exe -c "import pywinauto, comtypes, mss, mss.tools, PIL.Image, win32gui, win32process, win32clipboard, win32file; from app.skills.computer_use.window_ops import _uia_available; assert _uia_available(), 'UIA unavailable'; print('FROZEN_UIA_IMPORT_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen backend import test failed; installer will not be uploaded' }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official frontend dependencies
        working-directory: monaw/frontend
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Typecheck and syntax-check Electron notifications
        working-directory: monaw/frontend
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Frontend typecheck failed' }
          node --check electron/main.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron main syntax failed' }
          node --check electron/preload.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron preload syntax failed' }

      - name: Generate third-party license notices
        working-directory: monaw/backend
        run: |
          uv run --locked --group packaging python ../scripts/generate-third-party-notices.py
          if ($LASTEXITCODE -ne 0) { throw 'License notices failed' }

      - name: Package complete Windows installer
        working-directory: monaw/frontend
        run: |
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          $src = 'release/Monaw-Setup-1.1.0-x64.exe'
          if (!(Test-Path $src)) { throw 'Installer not found' }
          Copy-Item $src 'release/Monaw-UIA-1.1.0-Windows-x64.exe'
          (Get-FileHash 'release/Monaw-UIA-1.1.0-Windows-x64.exe' -Algorithm SHA256).Hash |
            Set-Content 'release/Monaw-UIA-1.1.0-Windows-x64.sha256.txt'

      - name: Upload installer and SHA-256 (expires after 3 days)
        uses: actions/upload-artifact@v4
        with:
          name: Monaw-UIA-1.1.0-Windows-x64
          path: |
            monaw/frontend/release/Monaw-UIA-1.1.0-Windows-x64.exe
            monaw/frontend/release/Monaw-UIA-1.1.0-Windows-x64.sha256.txt
          retention-days: 3
          if-no-files-found: error
